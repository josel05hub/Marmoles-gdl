<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MÁRMOLES.GDL · Cubiertas de granito, escaleras, pulido y brillado</title>
<meta name="description" content="Cubiertas en granito natural, revestimiento de escaleras, pulido y brillado. Pide tu cotización. Trabajamos en toda la zona metropolitana de Guadalajara, Jalisco.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4f0;--surface:#fff;--ink:#1c1c1a;--muted:#6b6963;--line:#dcd8d0;--slot:#ece9e3;--vein:rgba(120,116,108,.14);
--serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131312;--surface:#1b1b19;--ink:#efece6;--muted:#a19d94;--line:#34332f;--slot:#1f1f1d;--vein:rgba(220,214,200,.09)}}
:root[data-theme="dark"]{--bg:#131312;--surface:#1b1b19;--ink:#efece6;--muted:#a19d94;--line:#34332f;--slot:#1f1f1d;--vein:rgba(220,214,200,.09)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
.in{max-width:1080px;margin:0 auto;padding:0 20px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;padding-top:12px;padding-bottom:6px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.logo{height:46px;flex:none;display:block}
.logo svg,.logo img{height:100%;width:auto;display:block;aspect-ratio:406/572}
.mk{display:block;aspect-ratio:406/572;height:clamp(220px,30vw,330px);width:auto}
.name{font:600 22px/1 var(--serif);letter-spacing:.14em}
nav{display:flex;gap:24px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;padding:10px 0;font-size:13px;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;color:var(--muted);border-bottom:2px solid transparent}
nav a.on{color:var(--ink);border-color:var(--ink)}
main{padding-top:8px;padding-bottom:56px;min-height:70vh}
@media (max-width:640px){.hero{grid-template-columns:1fr!important;gap:24px!important;padding-top:40px!important}.hero .mk{order:-1;height:130px}}
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;padding:72px 0 56px;background:radial-gradient(900px 380px at 90% -10%,var(--vein),transparent 65%),linear-gradient(118deg,transparent 52%,var(--vein) 52.3%,transparent 53%),linear-gradient(104deg,transparent 71%,var(--vein) 71.2%,transparent 71.8%)}
.eyebrow{margin:0 0 14px;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font:600 clamp(42px,10vw,96px)/1 var(--serif);letter-spacing:.06em;overflow-wrap:anywhere}
h2{margin:0 0 12px;font:600 clamp(30px,6vw,46px)/1.1 var(--serif)}
h3{margin:0 0 6px;font:600 24px/1.2 var(--serif)}
.lead{max-width:56ch;color:var(--muted);font-size:18px;margin:18px 0 28px}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-block;padding:13px 24px;border:1px solid var(--ink);font-size:13px;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;color:var(--ink)}
.btn.solid{background:var(--ink);color:var(--bg)}
section{margin-top:56px}
.head{margin-top:40px}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{display:block;padding:26px;background:var(--surface);border:1px solid var(--line);text-decoration:none}
.card:hover{border-color:var(--ink)}
.card p{margin:0 0 14px;color:var(--muted);font-size:15px}
.num{display:block;margin-bottom:22px;font:500 15px var(--serif);letter-spacing:.2em;color:var(--muted)}
.more{font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.ph{margin:0}
.slot{background:var(--slot);overflow:hidden}
.slot.empty{aspect-ratio:4/3;border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:13px}
.slot img{width:100%;height:auto;display:block;cursor:zoom-in}
.grid .slot img{aspect-ratio:4/3;object-fit:cover}
.masonry{column-width:260px;column-gap:20px}
.masonry .ph{break-inside:avoid;margin:0 0 20px}
.zona{margin:-12px 0 28px;color:var(--muted);font-size:15px}
figcaption{margin-top:8px;font-size:14px;color:var(--muted)}
.cta{margin-top:56px;padding:36px 24px;border:1px solid var(--line);background:var(--surface);text-align:center}
.cta p{margin:0 0 18px;font:600 clamp(22px,4vw,30px)/1.2 var(--serif)}
.cols{display:grid;gap:40px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.row{display:flex;justify-content:space-between;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.row span{color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding-top:3px}
.row b{font-weight:500;text-align:right;overflow-wrap:anywhere}
.row a{text-decoration:none;border-bottom:1px solid var(--line)}
.step{padding:24px;border:1px solid var(--line);background:var(--surface)}
.step p{margin:0;color:var(--muted);font-size:15px}
.foot{border-top:1px solid var(--line);padding:24px 0;font-size:14px;color:var(--muted)}
.foot .in{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px}
.foot strong{color:var(--ink);letter-spacing:.12em}
#lb{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.9);display:grid;place-items:center;cursor:zoom-out}
#lb[hidden]{display:none}
#lb img{max-width:94vw;max-height:88vh;object-fit:contain}
</style>
</head>
<body>
<header class="top">
  <div class="in bar"><a class="brand" href="#inicio" aria-label="Ir al inicio"><span class="logo" id="logo"></span><span class="name" id="brand"></span></a></div>

    </header>
    <main class="in" id="app"></main>

    <script>
    /* ============================================================
       EDITA AQUÍ: todos los datos de la página están en este bloque.
          Cambia solo lo que está entre comillas "..."
             ============================================================ */
             const CONFIG = {
                  nombre: "MÁRMOLES.GDL",
                    lema: "Más de 10 años trabajando el mármol y granito natural: cubiertas, escaleras, pisos, pulido y brillado, reparación de piedra y lápidas.",
                      logo: "",                                   // Vacío = usa tu logotipo de rombos (ya incluido). Para cambiarlo, pega otra imagen data:image/...
                        telefonos: ["3320274948", "3329750731"],      // Llamadas (10 dígitos)
                          whatsapps: ["3320274938", "3329750731"],     // WhatsApp (10 dígitos; el primero es el principal)
                            correo: "marmoles.espinoza@hotmail.com",
                              zona: "toda la zona metropolitana de Guadalajara, Jalisco",
                                direccion: "",                              // Si tienes local, escribe la dirección y aparecerá con botón de Google Maps
                                  horario: "Lunes a viernes · 7:00 – 20:00 · Sábado · 8:00 – 17:00", // Ejemplo: "Lunes a viernes · 9:00 – 18:00" (vacío = no se muestra)
                                    facebook: "https://www.facebook.com/share/1BDsjUc6hM/",           // Pega el enlace completo; si está vacío no se muestra
                                      instagram: "",                              // Pega el enlace completo; si está vacío no se muestra
                                        destacadas: [{k:"c1"}, {k:"e1"}, {k:"c2"}],   // Fotos del inicio: usa la clave (k) del banco de fotos
                                          servicios: [
                                                { id:"cubiertas", nav:"Cubiertas", titulo:"Cubiertas de granito natural",
                                                      corto:"Cubiertas a la medida en granito natural.",
                                                            texto:"Cubiertas hechas a la medida en granito natural. Aquí puedes ver trabajos que ya entregamos.",
                                                                  fotos:[{k:"c1",titulo:"Cocina con isla y cubierta de granito natural"},{k:"c3",titulo:"Cocina con barra en granito natural"},{k:"c2",titulo:"Baño con cubierta y salpicadero en granito"},{k:"c4",titulo:"Cocina en granito negro"},{k:"c5",titulo:"Cocina en granito negro, otra vista"},{k:"c6",titulo:"Cocina con isla en granito negro"}] },                             // Agrega fotos: {src:"data:image/...", titulo:"Cocina en granito negro"}
                                                                      { id:"escaleras", nav:"Escaleras", titulo:"Revestimiento de escaleras",
                                                                            corto:"Escaleras revestidas en piedra natural.",
                                                                                  texto:"Revestimiento de escaleras en piedra natural, con acabado limpio y duradero.",
                                                                                        fotos:[{k:"e1",titulo:"Escalera de mármol con iluminación LED"},{k:"e2",titulo:"Escalera con peldaños de mármol"},{k:"e3",titulo:"Peldaños y descansos en mármol"},{k:"e4",titulo:"Escalera de mármol vista desde arriba"}] },
                                                                                            { id:"pulido", nav:"Pulido y brillado", titulo:"Pulido y brillado",
                                                                                                  corto:"Recuperamos el brillo de tus superficies.",
                                                                                                        texto:"Pulido y brillado para devolver el aspecto y el brillo a tus superficies de mármol y granito.",
                                                                                                              fotos:[] },
                                                                                                                  { id:"pisos", nav:"Pisos", titulo:"Instalación de pisos en mármol y granito",
                                                                                                                        corto:"Pisos de piedra natural, colocados a la medida de tu espacio.",
                                                                                                                              texto:"Instalación de pisos en mármol y granito natural, con nivelación y acabado cuidados para que el resultado dure años.",
                                                                                                                                    fotos:[] },
                                                                                                                                        { id:"lapidas", nav:"Lápidas", titulo:"Fabricación de lápidas y monumentos",

                                                                                                                                                    texto:"Fabricación de lápidas y monumentos en mármol y granito, con grabado y acabado personalizados.",

                                                                                                                                                              { id:"reparacion", nav:"Reparación", titulo:"Reparación de piedra dañada o rota",
                                                                                                                                                                    corto:"Reparamos cubiertas, pisos y escaleras dañadas.",
                                                                                                                                                                          texto:"Reparación de piedra natural dañada, rota o desportillada en cubiertas, pisos y escaleras, devolviéndole su acabado original.",
                                                                                                                                                                                fotos:[] }
                                          ]
             };
             /* ============================================================ */

             const $ = s => document.querySelector(s);
             const esc = t => String(t == null ? "" : t).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
             const wa = (msg, n) => "https://wa.me/52" + (n || CONFIG.whatsapps[0]) + "?text=" + encodeURIComponent(msg || "Hola, me gustaría pedir una cotización.");
             const fmt = n => n.replace(/(\d{2})(\d{4})(\d{4})/, "$1 $2 $3");
             const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
             const tel = "tel:+52" + CONFIG.telefonos[0];
             const maps = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(CONFIG.direccion);

             function slots(fotos, min) {
                  const items = fotos && fotos.length ? fotos : Array(min).fill(null);
                    const bank = typeof FOTOS !== "undefined" ? FOTOS : {};
                      return items.map(f => {
                            const src = f && (f.src || bank[f.k]);
                                return src
                                      ? `<figure class="ph"><div class="slot"><img src="${esc(src)}" alt="${esc(f.titulo || CONFIG.nombre)}" loading="lazy" data-zoom></div>${f.titulo ? `<figcaption>${esc(f.titulo)}</figcaption>` : ""}</figure>`
                                            : `<figure class="ph"><div class="slot empty"><span>+ Espacio para foto</span></div></figure>`;
                      }).join("");
             }

             let lc = 0;
             function logo(cls, v1, v2) {
                  if (CONFIG.logo) return `<img class="${cls}" src="${esc(CONFIG.logo)}" alt="Logotipo de ${esc(CONFIG.nombre)}">`;
                    const id = "lg" + (++lc), d = "M0-115L115 0 0 115-115 0Z";
                      return `<svg class="${cls}" viewBox="76 -7 406 572" role="img" aria-label="Logotipo de ${esc(CONFIG.nombre)}"><defs><clipPath id="${id}c"><path d="${d}"/></clipPath><g id="${id}"><path d="${d}"/><g clip-path="url(#${id}c)" fill="none" stroke-linecap="round" style="stroke:var(--bg)"><path stroke-width="${v1}" d="M0-115C8-72-8-40-1-1C5 40-4 78 3 115M-115 0C-72-5-40 5 0-1C40-7 78 3 115-3"/>${v2 ? `<path stroke-width="${v2}" d="M-46-66Q-24-64-6-51M64-46Q62-39 58-32M-57 27Q-45 50-32 77M13 12Q40 25 58 57"/>` : ""}</g></g></defs><use href="#${id}" style="fill:var(--ink)" transform="translate(196 278)"/><use href="#${id}" style="fill:var(--muted)" transform="translate(362 113)"/><use href="#${id}" style="fill:var(--muted)" transform="translate(362 445)"/></svg>`;
             }

             const inicio = () => `
             <section class="hero">
               <div>
                 <p class="eyebrow">Mármol y granito natural</p>
                   <h1>${esc(CONFIG.nombre)}</h1>
                     <p class="lead">${esc(CONFIG.lema)}</p>
                       <p class="zona">Trabajamos en ${esc(CONFIG.zona)}.</p>
                         <div class="btns">
                             <a class="btn solid" href="${wa()}" target="_blank" rel="noopener">Cotizar por WhatsApp</a>
                                 <a class="btn" href="#cubiertas">Ver trabajos</a>
                                   </div>
                                     </div>
                                       ${logo("mk", 5, 2.6)}
                                       </section>
                                       <section>
                                         <p class="eyebrow">Lo que hacemos</p>
                                           <div class="grid">${CONFIG.servicios.map((s, i) => `
                                               <a class="card" href="#${esc(s.id)}"><span class="num">0${i + 1}</span><h3>${esc(s.titulo)}</h3><p>${esc(s.corto)}</p><span class="more">Ver trabajos →</span></a>`).join("")}
                                                 </div>
                                                 </section>
                                                 <section>
                                                   <p class="eyebrow">Trabajos recientes</p>
                                                     <div class="grid">${slots(CONFIG.destacadas, 3)}</div>
                                                     </section>
                                                     <div class="cta">
                                                       <p>¿Tienes un proyecto en mente? Cuéntanos y te cotizamos.</p>
                                                         <div class="btns" style="justify-content:center">
                                                             <a class="btn solid" href="${wa()}" target="_blank" rel="noopener">Escribir por WhatsApp</a>
                                                                 <a class="btn" href="#contacto">Ver contacto</a>
                                                                   </div>
                                                                   </div>`;

                                                                   const nosotros = () => `
                                                                   <section class="head">
                                                                     <p class="eyebrow">Sobre nosotros</p>
                                                                       <h2>Más de 10 años trabajando la piedra natural</h2>
                                                                         <p class="lead">En ${esc(CONFIG.nombre)} llevamos más de 10 años dando forma al mármol y al granito natural. En ese tiempo hemos hecho cubiertas de cocina y baño, revestido escaleras, colocado pisos, pulido y devuelto el brillo a superficies desgastadas, reparado piedra dañada y fabricado lápidas y monumentos a la medida.</p>
                                                                           <p class="lead">Cada proyecto es distinto, así que revisamos tu espacio, te orientamos sobre el material y el acabado más adecuado, y trabajamos con cuidado para que el resultado se vea bien y dure años.</p>
                                                                           </section>
                                                                           <section>
                                                                             <p class="eyebrow">Lo que hacemos</p>
                                                                               <div class="grid">${CONFIG.servicios.map((s, i) => `
                                                                                   <a class="card" href="#${esc(s.id)}"><span class="num">0${i + 1}</span><h3>${esc(s.titulo)}</h3><p>${esc(s.corto)}</p><span class="more">Ver trabajos →</span></a>`).join("")}
